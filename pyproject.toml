[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proof2stim"
version = "0.1.0"
description = "Formal-witness-guided RTL coverage closure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "cocotb>=2.0,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
chia = [
  "chialoops @ git+https://github.com/ucb-bar/chia.git@a2c4dae46528055efa59444d54832336851f633f",
]

[project.scripts]
proof2stim = "proof2stim.cli:main"
proof2stim-doctor = "proof2stim.doctor:main"
proof2stim-validate-manifest = "proof2stim.manifest:main"

[tool.setuptools.packages.find]
include = ["proof2stim*"]

[tool.ruff]
line-length = 100
target-version = "py311"
